name: Add model draft credentials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-model-credentials.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch CRM
        shell: python
        run: |
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          css='''\n/* Model submission credentials */\n.credential-note{margin-top:6px;padding:7px 9px;border-left:3px solid var(--accent);background:var(--soft);border-radius:4px;font-size:12px;line-height:1.4}.credential-note a{color:#236440;font-weight:700}\n'''
          if '/* Model submission credentials */' not in s:
              s=s.replace('</style>',css+'</style>',1)

          marker='function renderEmailSelection(){'
          helpers=r'''const MODEL_DRAFT_CREDENTIALS={
  'new-york-women-claudia-lucchini':{text:'Walked for Mugler and Rick Owens.'},
  'new-york-women-maja-stockwell':{text:'Her mom was a model.',link:'https://www.instagram.com/maddestockwell?stkn=MXdqbnhzd2R3dnlkMw==',linkLabel:"Mom's Instagram"},
  'new-york-women-mary-timms':{text:'Partook in Vogue World with DVF, Former Miss Nigeria, over 1M followers on Instagram.',bold:true}
};
function modelDraftCredential(m){return m?MODEL_DRAFT_CREDENTIALS[m.id]||null:null}
function modelDraftCredentialHtml(m,ui=false){const c=modelDraftCredential(m);if(!c)return'';const text=c.bold?`<b>${esc(c.text)}</b>`:esc(c.text),link=c.link?` <a href="${esc(c.link)}"${ui?' target="_blank" rel="noopener"':''}>${esc(c.linkLabel||'Link')}</a>`:'';return ui?`<div class="credential-note">${text}${link}</div>`:`<div style="margin:6px 0 0">${text}${link}</div>`}
'''
          if 'const MODEL_DRAFT_CREDENTIALS=' not in s:
              if marker not in s: raise SystemExit('renderEmailSelection marker not found')
              s=s.replace(marker,helpers+marker,1)

          old=r'''<div class="muted ${availabilityConflict(m,date)?'status-warn':''}">${esc(m.availabilityStatus||'Unknown')}${m.holdProject?' · '+esc(m.holdProject):''}${availabilityConflict(m,date)?' · CONFLICT':''}${availabilityCaution(m,date)?' · HOLD':''}</div><div class="draft-model-controls">'''
          new=r'''<div class="muted ${availabilityConflict(m,date)?'status-warn':''}">${esc(m.availabilityStatus||'Unknown')}${m.holdProject?' · '+esc(m.holdProject):''}${availabilityConflict(m,date)?' · CONFLICT':''}${availabilityCaution(m,date)?' · HOLD':''}</div>${modelDraftCredentialHtml(m,true)}<div class="draft-model-controls">'''
          if old in s:
              s=s.replace(old,new,1)
          elif '${modelDraftCredentialHtml(m,true)}<div class="draft-model-controls">' not in s:
              raise SystemExit('draft UI credential insertion point not found')

          old=r'''${d.sources&&m.profile?`<div><a href="${esc(m.profile)}">Portfolio</a> · ${esc(m.location)} / ${esc(m.division)}</div>`:''}</div>`}).join('');'''
          new=r'''${d.sources&&m.profile?`<div><a href="${esc(m.profile)}">Portfolio</a> · ${esc(m.location)} / ${esc(m.division)}</div>`:''}${modelDraftCredentialHtml(m)}</div>`}).join('');'''
          if old in s:
              s=s.replace(old,new,1)
          elif '${modelDraftCredentialHtml(m)}</div>`}).join' not in s:
              raise SystemExit('email credential insertion point not found')

          p.write_text(s,encoding='utf-8')

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          grep -q "MODEL_DRAFT_CREDENTIALS" index.html
          grep -q "Walked for Mugler and Rick Owens" index.html
          grep -q "Partook in Vogue World with DVF" index.html
          grep -q "maddestockwell" index.html
          grep -q "modelDraftCredentialHtml(m,true)" index.html
          grep -q "modelDraftCredentialHtml(m)" index.html
          python - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('script block missing')
          open('/tmp/crm.js','w',encoding='utf-8').write(m.group(1))
          PY
          node --check /tmp/crm.js

      - name: Push CRM update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT CRM Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add automatic model credentials to draft emails"
          git push origin HEAD:main
