name: Add model draft credentials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-model-credentials.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch CRM
        shell: python
        run: |
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          dec=lambda v:base64.b64decode(v).decode('utf-8')
          css=dec('')
          helpers=dec('')
          old_ui=dec('')
          new_ui=dec('')
          old_email=dec('JHtkLnNvdXJjZXMmJm0ucHJvZmlsZT9gPGRpdj48YSBocmVmPSIke2VzYyhtLnByb2ZpbGUpfSI+UG9ydGZvbGlvPC9hPiDCtyAke2VzYyhtLmxvY2F0aW9uKX0gLyAke2VzYyhtLmRpdmlzaW9uKX08L2Rpdj5gOicnfTwvZGl2PmB9KS5qb2luKCcnKTs=')
          new_email=dec('JHtkLnNvdXJjZXMmJm0ucHJvZmlsZT9gPGRpdj48YSBocmVmPSIke2VzYyhtLnByb2ZpbGUpfSI+UG9ydGZvbGlvPC9hPiDCtyAke2VzYyhtLmxvY2F0aW9uKX0gLyAke2VzYyhtLmRpdmlzaW9uKX08L2Rpdj5gOicnfSR7bW9kZWxEcmFmdENyZWRlbnRpYWxIdG1sKG0pfTwvZGl2PmB9KS5qb2luKCcnKTs=')
          if '/* Model submission credentials */' not in s:
              s=s.replace('</style>',css+'</style>',1)
          if 'const MODEL_DRAFT_CREDENTIALS=' not in s:
              marker='function renderEmailSelection(){'
              if marker not in s: raise SystemExit('renderEmailSelection marker not found')
              s=s.replace(marker,helpers+marker,1)
          if old_ui in s:
              s=s.replace(old_ui,new_ui,1)
          elif '${modelDraftCredentialHtml(m,true)}<div class="draft-model-controls">' not in s:
              raise SystemExit('draft UI credential insertion point not found')
          if old_email in s:
              s=s.replace(old_email,new_email,1)
          elif '${modelDraftCredentialHtml(m)}</div>`}).join' not in s:
              raise SystemExit('email credential insertion point not found')
          p.write_text(s,encoding='utf-8')

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          grep -q "MODEL_DRAFT_CREDENTIALS" index.html
          grep -q "Walked for Mugler and Rick Owens" index.html
          grep -q "Partook in Vogue World with DVF" index.html
          grep -q "maddestockwell" index.html
          grep -q "modelDraftCredentialHtml(m,true)" index.html
          grep -q "modelDraftCredentialHtml(m)" index.html
          python -c "import re; s=open('index.html',encoding='utf-8').read(); m=re.search(r'<script>(.*)</script>',s,re.S); assert m; open('/tmp/crm.js','w',encoding='utf-8').write(m.group(1))"
          node --check /tmp/crm.js

      - name: Push CRM update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT CRM Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add automatic model credentials to draft emails"
          git push origin HEAD:main
