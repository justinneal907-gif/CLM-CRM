name: Finalize CRM identity migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-model-identity-update.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve later manual appearance edits
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function applyModelIdentity(m){const o=MODEL_IDENTITY_OVERRIDES[m.id]||{};const hair=o.hair||m.hair||'',eyes=o.eyes||m.eyes||'';const stats=mergeAppearanceStats(m.stats||m.measurements||'',hair,eyes);return {...m,name:o.name||MODEL_NAME_ALIASES[m.name]||m.name,hair,eyes,appearanceReviewed:'2026-09-16',appearanceBasis:'Portfolio imagery / agency profile research',stats,measurements:stats}}"
          new="function applyModelIdentity(m){const o=MODEL_IDENTITY_OVERRIDES[m.id]||{},reviewed=m.appearanceReviewed==='2026-09-16';const hair=(reviewed&&m.hair)?m.hair:(o.hair||m.hair||''),eyes=(reviewed&&m.eyes)?m.eyes:(o.eyes||m.eyes||'');const stats=mergeAppearanceStats(m.stats||m.measurements||'',hair,eyes);return {...m,name:o.name||MODEL_NAME_ALIASES[m.name]||m.name,hair,eyes,appearanceReviewed:'2026-09-16',appearanceBasis:'Portfolio imagery / agency profile research',stats,measurements:stats}}"
          if old not in s:
              raise SystemExit('Could not find appearance identity function')
          s=s.replace(old,new,1)
          s=s.replace("newModels:['Anhelena Sobol']","newModels:['Anhelena']",1)
          p.write_text(s,encoding='utf-8')
      - name: Validate and push
        shell: bash
        run: |
          grep -q "reviewed=m.appearanceReviewed==='2026-09-16'" index.html
          grep -q "newModels:\['Anhelena'\]" index.html
          git config user.name "ChatGPT CRM Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Finalize model identity migration"
          git push origin HEAD:main
