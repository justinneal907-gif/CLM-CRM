name: Update Sophia Pippen description

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Sophia description
        run: python scripts/update_sophia_description.py
      - name: Validate JavaScript
        run: node --check /tmp/app.js
      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Sophia Pippen description"
          git pull --rebase origin main
          git push
