name: Diagnose draft builder

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair draft builder
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          marker='initNav();setupFilters();hydrateDraft();renderAll();'
          if marker not in text: raise SystemExit('CRM initialization marker not found')
          fix=base64.b64decode('').decode()
          if 'EMAIL DRAFT BUILDER STABILITY FIX 2026-09-17' not in text: text=text.replace(marker,fix+'\n'+marker,1)
          old=base64.b64decode('').decode()
          new=base64.b64decode('').decode()
          if old in text: text=text.replace(old,new,1)
          elif new not in text: raise SystemExit('Draft input listener block not found')
          path.write_text(text,encoding='utf-8')
          PY
      - name: Validate CRM JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          assert 'EMAIL DRAFT BUILDER STABILITY FIX 2026-09-17' in html
          assert 'queueEmailDraftRender' in html
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- index.html; then echo "Repair already present"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix email draft builder responsiveness and saving"
          git pull --rebase origin main
          git push
