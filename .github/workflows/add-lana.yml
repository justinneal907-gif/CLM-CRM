name: Add Lana to CRM

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-lana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Lana to seeded roster
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          model_id = '"id":"agency-women-lana"'
          marker = "const BASE_ROSTER=["
          entry = '{"id":"agency-women-lana","name":"Lana","location":"","division":"Women","measurements":"Measurements pending","profileUrl":"","photoUrl":"","photoFilename":"","source":"User request","sourceDate":"2026-09-17","activeBoard":true,"notes":"Added to CRM September 17, 2026 at user request. Public profile, measurements, market and primary photo were not verified when added."},'

          if model_id not in text:
              if marker not in text:
                  raise SystemExit("BASE_ROSTER marker not found")
              text = text.replace(marker, marker + entry, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit roster update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Lana is already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Lana to CRM roster"
          git push
