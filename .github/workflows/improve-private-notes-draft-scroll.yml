name: Improve private notes and draft scroll

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CRM UI
        run: python scripts/improve_private_notes_and_draft_scroll.py
      - name: Validate JavaScript
        run: node --check /tmp/app.js
      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve private notes visibility and draft opening position"
          git pull --rebase origin main
          git push
