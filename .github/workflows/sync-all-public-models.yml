name: Sync all public CLM models

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync public roster
        run: python scripts/sync_all_public_models.py
      - name: Validate JavaScript
        run: node --check /tmp/app.js
      - name: Commit roster update
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add all public CLM models to CRM"
          git pull --rebase origin main
          git push
