name: Add Sophia to all drafts

on:
  push:
    branches: [sophia-all-drafts]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Sophia and photos
        run: python scripts/add_sophia_all_drafts.py
      - name: Validate JavaScript
        run: node --check /tmp/app.js
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Sophia Pippen to all drafts with photos"
          git push origin HEAD:sophia-all-drafts
