name: Add Bianca to CRM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-bianca.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-crm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Bianca roster record
        shell: python
        run: |
          from pathlib import Path
          import json

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_json_const(src, name, next_marker, transform):
              prefix = f'const {name}='
              start = src.index(prefix)
              value_start = start + len(prefix)
              end = src.index(';\n' + next_marker, value_start)
              value = json.loads(src[value_start:end])
              value = transform(value)
              return src[:value_start] + json.dumps(value, ensure_ascii=False, separators=(',', ':')) + src[end:]

          canonical_id = 'germany-women-bianca-eigenfeld-own'
          canonical_model = {
              'id': canonical_id,
              'name': 'Bianca Eigenfeld Own',
              'location': 'Germany',
              'division': 'Women',
              'measurements': 'Height: 180cm | Bust: 85cm | Waist: 62cm | Hip: 90cm | Shoe: 41EU | Hair: Chestnut Brown | Eyes: Blue',
              'profileUrl': 'https://www.chezlesmannequins.com/search?q=Bianca',
              'photoUrl': '',
              'photoFilename': '',
              'source': 'Chez Les Mannequins public site search',
              'activeBoard': True,
              'notes': 'Official Chez Les Mannequins site search returns Bianca Eigenfeld Own. The canonical profile slug and exact agency market are not exposed by the public result; Germany is retained from the existing CRM record.'
          }

          def roster_transform(items):
              cleaned = [m for m in items if m.get('name') != 'Bianca Eigenfeld Own' and 'bianca-eigenfeld-own' not in m.get('id','')]
              cleaned.append(canonical_model)
              return cleaned

          text = replace_json_const(text, 'BASE_ROSTER', 'const NICHE_MAP=', roster_transform)
          text = replace_json_const(text, 'NICHE_MAP', 'const SECONDARY_NICHE_MAP=', lambda m: {**m, 'Bianca Eigenfeld Own':'Fashion-Commercial'})
          text = replace_json_const(text, 'SECONDARY_NICHE_MAP', 'const NICHE_ORDER=', lambda m: {**m, 'Bianca Eigenfeld Own':'Beauty'})

          def identity_transform(m):
              out = {k:v for k,v in m.items() if 'bianca-eigenfeld-own' not in k}
              out[canonical_id] = {'name':'Bianca','hair':'Chestnut Brown','eyes':'Blue'}
              return out

          text = replace_json_const(text, 'MODEL_IDENTITY_OVERRIDES', 'const MODEL_NAME_ALIASES=', identity_transform)
          text = replace_json_const(text, 'MODEL_NAME_ALIASES', 'function stripAppearanceStats', lambda m: {**m, 'Bianca Eigenfeld Own':'Bianca'})

          text = text.replace("newModels:['Anhelena','Bianca','Bianca']", "newModels:['Anhelena','Bianca']")
          if "newModels:['Anhelena']" in text:
              text = text.replace("newModels:['Anhelena']", "newModels:['Anhelena','Bianca']", 1)

          path.write_text(text, encoding='utf-8')
          print('Bianca normalized to one active CRM record.')

      - name: Commit CRM update
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Normalize Bianca CRM record"
          git push
