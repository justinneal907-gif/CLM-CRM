name: Add Bianca to CRM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-bianca.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-crm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Bianca to roster seed
        shell: python
        run: |
          from pathlib import Path
          import json

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          model_id = 'europe-women-bianca-eigenfeld-own'

          if model_id in text:
              print('Bianca is already present; no patch needed.')
          else:
              model = {
                  'id': model_id,
                  'name': 'Bianca Eigenfeld Own',
                  'location': 'Europe',
                  'division': 'Women',
                  'measurements': 'Height: 180cm | Bust: 85cm | Waist: 62cm | Hip: 90cm | Shoe: 41EU | Hair: Chestnut Brown | Eyes: Blue',
                  'profileUrl': 'https://www.chezlesmannequins.com/search?q=Bianca',
                  'photoUrl': '',
                  'photoFilename': '',
                  'source': 'Chez Les Mannequins site search',
                  'activeBoard': True,
                  'notes': 'Official Chez Les Mannequins site search returns Bianca Eigenfeld Own. Direct profile slug and market are not exposed by the current public result; market is recorded conservatively as Europe.'
              }

              base_marker = '];\nconst NICHE_MAP='
              base_start = text.index('const BASE_ROSTER=[')
              base_end = text.index(base_marker, base_start)
              text = text[:base_end] + ',' + json.dumps(model, ensure_ascii=False, separators=(',', ':')) + text[base_end:]

              def add_object_entry(src, const_name, next_marker, key, value):
                  start = src.index(f'const {const_name}={{')
                  end = src.index('};\n' + next_marker, start)
                  entry = ',' + json.dumps(key, ensure_ascii=False) + ':' + json.dumps(value, ensure_ascii=False, separators=(',', ':'))
                  return src[:end] + entry + src[end:]

              text = add_object_entry(text, 'NICHE_MAP', 'const SECONDARY_NICHE_MAP=', 'Bianca Eigenfeld Own', 'Fashion-Commercial')
              text = add_object_entry(text, 'SECONDARY_NICHE_MAP', 'const NICHE_ORDER=', 'Bianca Eigenfeld Own', 'Beauty')
              text = add_object_entry(text, 'MODEL_IDENTITY_OVERRIDES', 'const MODEL_NAME_ALIASES=', model_id, {'name':'Bianca','hair':'Chestnut Brown','eyes':'Blue'})
              text = add_object_entry(text, 'MODEL_NAME_ALIASES', 'function stripAppearanceStats', 'Bianca Eigenfeld Own', 'Bianca')

              if "newModels:['Anhelena']" in text:
                  text = text.replace("newModels:['Anhelena']", "newModels:['Anhelena','Bianca']", 1)

              path.write_text(text, encoding='utf-8')
              print('Bianca roster seed added.')

      - name: Commit CRM update
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Bianca to CRM roster"
          git push
