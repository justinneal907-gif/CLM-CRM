name: Normalize saved draft model names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-draft-html-names.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize names inside cached saved-draft HTML
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function shortModelName(n){return MODEL_NAME_ALIASES[n]||n}\nfunction normalizeRecordModelNames(r){if(!r||typeof r!=='object')return r;const out={...r};if(Array.isArray(out.models))out.models=out.models.map(shortModelName);if(typeof out.model==='string')out.model=shortModelName(out.model);return out}"
          new="function shortModelName(n){return MODEL_NAME_ALIASES[n]||n}\nfunction replaceModelNamesInText(v){let out=String(v||'');for(const [from,to] of Object.entries(MODEL_NAME_ALIASES))out=out.split(from).join(to);return out}\nfunction normalizeRecordModelNames(r){if(!r||typeof r!=='object')return r;const out={...r};if(Array.isArray(out.models))out.models=out.models.map(shortModelName);if(typeof out.model==='string')out.model=shortModelName(out.model);if(typeof out.html==='string'&&out.html)out.html=replaceModelNamesInText(out.html);return out}"
          if old not in s:
              raise SystemExit('Could not find draft-name normalization function')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate and push
        shell: bash
        run: |
          grep -q "function replaceModelNamesInText" index.html
          git config user.name "ChatGPT CRM Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Normalize model names in saved draft HTML"
          git push origin HEAD:main
