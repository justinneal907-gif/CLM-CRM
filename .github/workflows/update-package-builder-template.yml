name: Update package builder template

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-package-builder-template.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch CRM
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          a='<div class="field"><label>Add a roster group by main niche</label>'; b='<div id="submissionWarning"'; i=s.find(a); j=s.find(b,i)
          if i<0 or j<0: raise SystemExit('package builder sections not found')
          s=s[:i]+s[j:]
          old='<div class="field"><label>Relevant brief / notes</label><textarea id="emailContext" rows="4" placeholder="Casting fit, dates, usage, rate, location, or other relevant information."></textarea></div>'
          new='<div class="field"><label>Email context (optional)</label><textarea id="emailContext" rows="4" placeholder="Optional context for non-submission messages, such as availability or follow-up details."></textarea></div><div class="field"><label>Private notes</label><textarea id="emailPrivateNotes" rows="4" placeholder="Internal package notes. Saved in the CRM and never included in the email draft."></textarea><div class="muted tiny" style="margin-top:5px">Saved with this package · never included in preview, copied email, or Gmail compose.</div></div>'
          if old not in s: raise SystemExit('context field not found')
          s=s.replace(old,new,1)
          checks='<div class="checkrow"><label><input type="checkbox" id="includeStats" checked/> Measurements</label><label><input type="checkbox" id="includePhotos" checked/> Photos</label><label><input type="checkbox" id="includeSources" checked/> Portfolio links</label></div>'
          library=checks+'<div class="field photo-library-panel"><label>Photo library</label><div class="muted">Choose a model to browse the agency photo and any photos you save here. Library photos stay available for future packages in this browser.</div><div class="photo-library-tools"><select id="photoLibraryModel" onchange="renderPhotoLibrary()"></select><input id="photoLibraryUrl" type="url" placeholder="Add photo URL"><button class="btn" type="button" onclick="addPhotoLibraryUrl()">Add URL</button><label class="btn" style="text-align:center">Upload photos<input id="photoLibraryUpload" type="file" accept="image/*" multiple hidden onchange="addPhotoLibraryFiles(this)"></label></div><div id="photoLibraryGrid" class="photo-library-grid"></div></div>'
          if checks not in s: raise SystemExit('check row not found')
          s=s.replace(checks,library,1)
          css='.photo-library-panel{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fafbf9}.photo-library-tools{display:grid;grid-template-columns:minmax(160px,.8fr) minmax(200px,1.5fr) auto auto;gap:7px;margin-top:8px}.photo-library-tools select,.photo-library-tools input{width:100%;min-width:0;border:1px solid #bdc6bf;border-radius:7px;padding:9px;background:white}.photo-library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}.photo-library-card{border:1px solid var(--line);border-radius:8px;padding:7px;background:#fff}.photo-library-card.active{outline:2px solid var(--accent);outline-offset:1px}.photo-library-card img{width:100%;height:160px;object-fit:cover;border-radius:6px;display:block;margin-bottom:6px}.photo-library-card .btn{width:100%;margin-top:4px}.photo-library-empty{padding:12px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);margin-top:10px}@media(max-width:760px){.photo-library-tools{grid-template-columns:1fr}.photo-library-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}'
          s=s.replace('</style>',css+'</style>',1)
          override=base64.b64decode('').decode('utf-8')
          marker='initNav();setupFilters();hydrateDraft();renderAll();'
          if marker not in s: raise SystemExit('init marker not found')
          s=s.replace(marker,override+'\n'+marker,1)
          s=s.replace(";$('#addEmailNicheBtn').onclick=addEmailNicheGroup;",';').replace("$('#applyVariantBtn').onclick=applyPackageVariant;",'')
          s=s.replace("'emailLink','emailContext','castingBriefRaw'","'emailLink','emailContext','emailPrivateNotes','castingBriefRaw'",1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate package builder
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "Add a roster group by main niche" index.html
          ! grep -q "<label>Package variant</label>" index.html
          grep -q "Private notes" index.html
          grep -q "Photo library" index.html
          grep -q "famous 90s model from Sweden" index.html
          grep -q "We preselected a few models and put them below" index.html
          grep -q "emailPrivateNotes" index.html
          python -c "import re; s=open('index.html',encoding='utf-8').read(); m=re.search(r'<script>(.*)</script>',s,re.S); assert m; open('/tmp/crm.js','w',encoding='utf-8').write(m.group(1))"
          node --check /tmp/crm.js

      - name: Commit CRM update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT CRM Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Match package draft template and add photo library"
          git push origin HEAD:main
