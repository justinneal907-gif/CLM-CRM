name: Update package builder template

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-package-builder-template.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch CRM
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def rb(a,b,new,label):
              global s
              i=s.find(a); j=s.find(b,i+len(a))
              if i<0 or j<0: raise SystemExit(label+' markers not found')
              s=s[:i]+new+s[j:]

          def rep(a,b,label):
              global s
              if a not in s: raise SystemExit(label+' marker not found')
              s=s.replace(a,b,1)

          # Remove the two package-builder sections the user no longer wants.
          a='<div class="field"><label>Add a roster group by main niche</label>'
          b='<div id="submissionWarning"'
          i=s.find(a); j=s.find(b,i)
          if i<0 or j<0: raise SystemExit('builder controls not found')
          s=s[:i]+s[j:]

          # Add private notes that persist with a package but never render into email HTML.
          old='<div class="field"><label>Relevant brief / notes</label><textarea id="emailContext" rows="4" placeholder="Casting fit, dates, usage, rate, location, or other relevant information."></textarea></div>'
          rep(old,old+'<div class="field"><label>Private notes</label><textarea id="emailPrivateNotes" rows="4" placeholder="Internal package notes. Saved in the CRM and never included in the email draft."></textarea><div class="muted tiny" style="margin-top:5px">Not included in preview, copied email, or Gmail compose.</div></div>','private notes')

          # Put a persistent photo library directly in the package builder.
          checks='<div class="checkrow"><label><input type="checkbox" id="includeStats" checked/> Measurements</label><label><input type="checkbox" id="includePhotos" checked/> Photos</label><label><input type="checkbox" id="includeSources" checked/> Portfolio links</label></div>'
          library=checks+'<div class="field photo-library-panel"><label>Photo library</label><div class="muted">Choose a model to browse the agency photo and photos you save here. Saved photos stay available for future packages in this browser.</div><div class="photo-library-tools"><select id="photoLibraryModel"></select><input id="photoLibraryUrl" type="url" placeholder="Add photo URL"><button class="btn" type="button" id="photoLibraryAddUrlBtn">Add URL</button><label class="btn" style="text-align:center">Upload<input id="photoLibraryUpload" type="file" accept="image/*" multiple hidden></label></div><div id="photoLibraryGrid" class="photo-library-grid"></div></div>'
          rep(checks,library,'photo library ui')

          css='.photo-library-panel{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fafbf9}.photo-library-tools{display:grid;grid-template-columns:minmax(160px,.8fr) minmax(200px,1.5fr) auto auto;gap:7px;margin-top:8px}.photo-library-tools select,.photo-library-tools input{width:100%;min-width:0;border:1px solid #bdc6bf;border-radius:7px;padding:9px;background:white}.photo-library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}.photo-library-card{border:1px solid var(--line);border-radius:8px;padding:7px;background:#fff}.photo-library-card.active{outline:2px solid var(--accent)}.photo-library-card img{width:100%;height:160px;object-fit:cover;border-radius:6px;display:block;margin-bottom:6px}.photo-library-card .btn{width:100%;margin-top:4px}.photo-library-empty{padding:12px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);margin-top:10px}@media(max-width:760px){.photo-library-tools{grid-template-columns:1fr}.photo-library-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}'
          if '.photo-library-panel{' not in s: s=s.replace('</style>',css+'</style>',1)

          # Extend saved data additively so existing browser data wins and is preserved.
          rep("brief:'',castingBriefRaw:''","brief:'',notes:'',castingBriefRaw:''",'seed notes')
          rep('selected:[],customPhotos:{},settings:','selected:[],customPhotos:{},photoLibrary:{},settings:','seed library')
          rep('out.customPhotos={...(legacy.customPhotos||{})};return out}','out.customPhotos={...(legacy.customPhotos||{})};out.photoLibrary={...(legacy.photoLibrary||{})};return out}','legacy library')
          rep('data.draft={...structuredClone(seed.draft),...(incoming.draft||{})};data.activeDraftId=','data.draft={...structuredClone(seed.draft),...(incoming.draft||{})};data.photoLibrary={...(incoming.photoLibrary||{})};data.activeDraftId=','recovered library')

          rb('function captureDraft(){','function hydrateDraft(){',"""function captureDraft(){db.draft={...(db.draft||{}),purpose:$('#emailPurpose').value,contactId:$('#emailContact').value,contactName:$('#emailContactName').value,company:$('#emailCompany').value,recipientEmail:$('#emailRecipient').value,brandProject:$('#emailBrand').value,packageLink:$('#emailLink').value,brief:$('#emailContext').value,notes:$('#emailPrivateNotes')?.value||'',castingBriefRaw:$('#castingBriefRaw')?.value||db.draft?.castingBriefRaw||'',parsedBrief:db.draft?.parsedBrief||null,subject:$('#emailSubject').value,includeStats:$('#includeStats').checked,includePhotos:$('#includePhotos').checked,includeSources:$('#includeSources').checked,modelIds:[...selected]}}
""",'capture')
          rb('function hydrateDraft(){','function renderContactOptions(){',"""function hydrateDraft(){const d=db.draft||seed.draft;$('#emailPurpose').value=d.purpose||'submission';$('#emailContact').value=d.contactId||'';$('#emailContactName').value=d.contactName||'';$('#emailCompany').value=d.company||'';$('#emailRecipient').value=d.recipientEmail||'';$('#emailBrand').value=d.brandProject||'';$('#emailLink').value=d.packageLink||'https://canva.link/hkqja7ybl587pm8';$('#emailContext').value=d.brief||'';if($('#emailPrivateNotes'))$('#emailPrivateNotes').value=d.notes||'';if($('#castingBriefRaw'))$('#castingBriefRaw').value=d.castingBriefRaw||'';$('#emailSubject').value=d.subject||'Model Package';$('#includeStats').checked=d.includeStats!==false;$('#includePhotos').checked=d.includePhotos!==false;$('#includeSources').checked=d.includeSources!==false;renderBriefSummary()}
""",'hydrate')

          # Replace draft photo handling with a reusable per-model library.
          rb('function draftPhotoSelections(){','function normalizedBrandName(){',r"""function photoLibrary(){db.photoLibrary=db.photoLibrary||{};return db.photoLibrary}
function draftPhotoSelections(){db.draft=db.draft||structuredClone(seed.draft);db.draft.photoSelections=db.draft.photoSelections||{};return db.draft.photoSelections}
function draftPhotoForModel(m){return draftPhotoSelections()[m.id]||(db.customPhotos||{})[m.id]||m.photo||m.photoUrl||''}
function draftPhotoOptions(m){const out=[];const add=(x,label)=>{const url=typeof x==='string'?x:(x?.url||x?.src||'');if(url&&!out.some(y=>y.url===url))out.push({url,label:label||(x?.label||'Saved photo')})};(photoLibrary()[m.id]||[]).forEach(x=>add(x,'Saved library photo'));[m.photos,m.photoLibrary,m.portfolioPhotos,m.images].forEach(a=>Array.isArray(a)&&a.forEach(x=>add(x,'Portfolio photo')));add((db.customPhotos||{})[m.id],'Custom photo');add(m.photo||m.photoUrl,'Agency photo');return out.slice(0,20)}
function persistDraftPresentation(){db.selected=[...selected];db.draft=db.draft||structuredClone(seed.draft);db.draft.modelIds=[...selected];localStorage.setItem(NEW_KEY,JSON.stringify(db))}
function saveLibraryPhoto(id,url,label='Saved photo'){const v=String(url||'').trim();if(!v)return false;const lib=photoLibrary();lib[id]=lib[id]||[];if(lib[id].some(x=>(typeof x==='string'?x:x.url)===v))return false;if(lib[id].length>=12)lib[id].shift();lib[id].push({url:v,label});return true}
function setDraftPhotoUrl(id,url){const v=String(url||'').trim();if(v){saveLibraryPhoto(id,v,'Saved from package builder');draftPhotoSelections()[id]=v}else delete draftPhotoSelections()[id];persistDraftPresentation();renderEmail();setStatus(v?'Photo saved to library and selected.':'Using the model default photo.')}
function resetDraftPhoto(id){delete draftPhotoSelections()[id];persistDraftPresentation();renderEmail();setStatus('Using the model default photo.')}
async function fileToDraftPhoto(file){if(!file)return'';try{const raw=await fileToDataUrl(file);return await new Promise(resolve=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1000/img.width,1400/img.height),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.8))};img.onerror=()=>resolve(raw);img.src=raw})}catch{return''}}
async function setDraftPhotoFile(id,input){const f=input?.files?.[0];if(!f)return;const data=await fileToDraftPhoto(f);if(!data)return setStatus('Could not read that image.');saveLibraryPhoto(id,data,f.name||'Uploaded photo');draftPhotoSelections()[id]=data;persistDraftPresentation();renderEmail();setStatus('Uploaded photo saved to library and selected.')}
function useLibraryPhoto(id,index){const m=db.models.find(x=>x.id===id),p=m&&draftPhotoOptions(m)[index];if(!p)return;if(!selected.includes(id))selected.push(id);draftPhotoSelections()[id]=p.url;persistDraftPresentation();renderEmail();setStatus('Library photo selected for this draft.')}
function removeLibraryPhoto(id,index){const m=db.models.find(x=>x.id===id),p=m&&draftPhotoOptions(m)[index];if(!p)return;const lib=photoLibrary();if(!(lib[id]||[]).some(x=>(typeof x==='string'?x:x.url)===p.url))return;lib[id]=lib[id].filter(x=>(typeof x==='string'?x:x.url)!==p.url);if(draftPhotoSelections()[id]===p.url)delete draftPhotoSelections()[id];persistDraftPresentation();renderEmail();setStatus('Photo removed from library.')}
function renderPhotoLibrary(){const sel=$('#photoLibraryModel'),grid=$('#photoLibraryGrid');if(!sel||!grid)return;const cur=sel.value;sel.innerHTML=db.models.map(m=>`<option value="${esc(m.id)}">${esc(m.name)} · ${esc(m.location)}</option>`).join('');sel.value=(cur&&db.models.some(m=>m.id===cur))?cur:(selected[0]||db.models[0]?.id||'');const m=db.models.find(x=>x.id===sel.value);if(!m){grid.innerHTML='<div class="photo-library-empty">No model selected.</div>';return}const opts=draftPhotoOptions(m),pick=draftPhotoForModel(m);grid.innerHTML=opts.length?opts.map((p,i)=>`<div class="photo-library-card ${pick===p.url?'active':''}"><img src="${esc(p.url)}" alt="${esc(m.name)} photo ${i+1}"><div class="tiny"><b>${esc(p.label)}</b></div><button class="btn ${pick===p.url?'primary':''}" type="button" onclick="useLibraryPhoto('${m.id}',${i})">${pick===p.url?'Selected':'Use in draft'}</button>${(photoLibrary()[m.id]||[]).some(x=>(typeof x==='string'?x:x.url)===p.url)?`<button class="btn danger" type="button" onclick="removeLibraryPhoto('${m.id}',${i})">Remove</button>`:''}</div>`).join(''):'<div class="photo-library-empty">No photo yet. Add a URL or upload one above.</div>'}
async function addPhotoLibraryFiles(input){const id=$('#photoLibraryModel')?.value||'';if(!id)return;for(const f of [...(input?.files||[])]){const data=await fileToDraftPhoto(f);if(data)saveLibraryPhoto(id,data,f.name||'Uploaded photo')}input.value='';localStorage.setItem(NEW_KEY,JSON.stringify(db));renderPhotoLibrary();setStatus('Photos saved to the library.')}
function addPhotoLibraryUrl(){const id=$('#photoLibraryModel')?.value||'',url=$('#photoLibraryUrl')?.value.trim()||'';if(!id||!url)return setStatus('Choose a model and paste a photo URL.');saveLibraryPhoto(id,url,'Saved URL');$('#photoLibraryUrl').value='';localStorage.setItem(NEW_KEY,JSON.stringify(db));renderPhotoLibrary();setStatus('Photo URL saved to the library.')}
const MODEL_DRAFT_CREDENTIALS={
'new-york-women-claudia-lucchini':{text:'Walked for Mugler and Rick Owens.',red:true,bold:true},
'new-york-women-maja-stockwell':{text:'is famous 90s model from Sweden',link:'https://www.instagram.com/maddestockwell?stkn=MXdqbnhzd2R3dnlkMw==',linkLabel:'Mom',linkFirst:true,red:true},
'new-york-women-mary-timms':{text:'Partook in Vogue World with DVF, Former Miss Nigeria, over 1M followers on Instagram.',red:true,bold:true}
};
function modelDraftCredential(m){return m?MODEL_DRAFT_CREDENTIALS[m.id]||null:null}
function modelDraftCredentialHtml(m,ui=false){const c=modelDraftCredential(m);if(!c)return'';const a=c.link?`<a href="${esc(c.link)}"${ui?' target="_blank" rel="noopener"':''}>${esc(c.linkLabel||'Link')}</a>`:'';const body=c.linkFirst?`<b>${a}</b> ${esc(c.text)}`:(c.bold?`<b>${esc(c.text)}</b>`:esc(c.text))+(a?` ${a}`:'');return ui?`<div class="credential-note" style="${c.red?'color:#ff0000;':''}">${body}</div>`:`<div style="${c.red?'color:#ff0000;':''}margin:2px 0 8px">${body}</div>`}
function renderEmailSelection(){if(!$('#selectedModels'))return;const date=briefPrimaryDate(),picked=selectedModels();$('#selectedModels').innerHTML=(picked.length?'<div class="drag-hint">Email order follows this list. Choose photos from the library or use the controls on each model.</div>':'')+picked.map((m,index)=>{const pick=draftPhotoForModel(m),options=draftPhotoOptions(m);return `<div class="draft-model-card" draggable="true" ondragstart="dragSelectedModel(event,'${m.id}')" ondragover="event.preventDefault()" ondrop="dropSelectedModel(event,'${m.id}')"><div class="draft-model-head">${pick?`<img class="draft-model-thumb" src="${esc(pick)}" alt="${esc(m.name)} draft photo">`:`<div class="draft-model-thumb placeholder" style="display:flex;align-items:center;justify-content:center">${esc(initials(m.name))}</div>`}<div><div><b>${index+1}. ${esc(m.name)}</b> · ${esc(m.location)} / ${esc(m.division)}</div><div class="muted">${esc(m.niche||'Unclassified')}${m.secondaryNiche?' · Secondary: '+esc(m.secondaryNiche):''}</div><div class="muted">${esc(m.stats||m.measurements||'')}</div><div class="muted ${availabilityConflict(m,date)?'status-warn':''}">${esc(m.availabilityStatus||'Unknown')}${m.holdProject?' · '+esc(m.holdProject):''}${availabilityConflict(m,date)?' · CONFLICT':''}${availabilityCaution(m,date)?' · HOLD':''}</div>${modelDraftCredentialHtml(m,true)}<div class="draft-model-controls"><button class="btn" type="button" onclick="moveSelectedModel('${m.id}',-1)" ${index===0?'disabled':''}>↑ Move up</button><button class="btn" type="button" onclick="moveSelectedModel('${m.id}',1)" ${index===picked.length-1?'disabled':''}>↓ Move down</button><button class="btn danger" type="button" onclick="removeFromEmail('${m.id}')">Remove</button></div></div></div>${options.length>1?`<div class="draft-photo-strip">${options.map((p,i)=>`<button class="draft-photo-choice ${pick===p.url?'active':''}" type="button" title="${esc(p.label)}" onclick="useLibraryPhoto('${m.id}',${i})"><img src="${esc(p.url)}" alt="${esc(m.name)} photo option ${i+1}"></button>`).join('')}</div>`:''}<div class="draft-photo-controls"><input type="url" placeholder="Paste a photo URL and save it to the library" onchange="setDraftPhotoUrl('${m.id}',this.value)"><button class="btn" type="button" onclick="resetDraftPhoto('${m.id}')">Use default</button></div><div class="draft-photo-upload"><input type="file" accept="image/*" onchange="setDraftPhotoFile('${m.id}',this)"><span class="muted tiny">Upload is compressed, saved to the photo library, and selected for this draft.</span></div></div>`}).join('')||'<div class="empty">No models selected.</div>';renderSubmissionWarnings();renderPhotoLibrary()}
""",'photo subsystem')

          # Match the ON Running example for submissions: Hi, HERE line, model stats, portfolio, credential, image, signature.
          rb('function emailHtml(){','function openInWorkGmail(){',r"""function emailHtml(){const d={purpose:$('#emailPurpose').value,contactName:$('#emailContactName').value.trim(),brand:$('#emailBrand').value.trim(),link:$('#emailLink').value.trim(),brief:$('#emailContext').value.trim(),stats:$('#includeStats').checked,photos:$('#includePhotos').checked,sources:$('#includeSources').checked};const picked=selectedModels(),first=d.contactName.split(/\s+/)[0]||'',sal=first?`Hi ${esc(first)},`:'Hi,';let lead='';if(d.purpose==='submission'){const here=d.link?`<a href="${esc(d.link)}" style="color:#4285f4;font-size:18px" target="_blank">HERE</a>`:'HERE';lead=`${here} are our model suggestions${d.brand?' for '+esc(d.brand):''}. We preselected a few models and put them below.`}else if(d.purpose==='followup')lead=`Following up with our model suggestions${d.brand?' for '+esc(d.brand):''}.`;else if(d.purpose==='availability')lead=`Sharing availability and model details${d.brand?' for '+esc(d.brand):''}.`;else lead=`I wanted to introduce a few models from our roster${d.brand?' for '+esc(d.brand):''}.`;const blocks=picked.map(m=>{const name=m.name==='Sophia Pippen'?'Sophia Pippen (Daughter of Scottie Pippen)':m.name;return `<div style="color:#000;font-size:13px;margin:0 0 24px"><div style="line-height:1.65"><b>${esc(name)}</b>${d.stats&&m.stats?' | '+formatStats(m.stats):''}</div>${d.sources&&m.profile?`<div><a href="${esc(m.profile)}" target="_blank">Portfolio</a> · ${esc(m.location)} / ${esc(m.division)}</div>`:''}${modelDraftCredentialHtml(m)}${d.photos&&draftPhotoForModel(m)?`<div style="text-align:left"><img src="${esc(draftPhotoForModel(m))}" width="440" style="max-width:100%;height:auto;margin:8px 0 0" alt="${esc(m.name)}"></div>`:''}</div>`}).join('');const extra=d.purpose!=='submission'&&d.brief?`<br><div>${esc(d.brief).replace(/\n/g,'<br>')}</div>`:'';return `<div style="font-family:Arial,sans-serif;font-size:13px;color:#000"><div>${sal}</div><br><div>${lead}</div>${extra}<br>${blocks||'<div>[Select one or more models]</div>'}<div>Thank you,</div><div>Justin</div><br><div><i>NYC Division</i></div><div><b>Chez Les Mannequins · Creative Agency</b></div><div><i>Model Representation | Artist Management | Casting | Production | Advertising</i></div></div>`}
""",'email template')

          # Remove hooks for deleted UI and wire new controls.
          s=s.replace(";$('#addEmailNicheBtn').onclick=addEmailNicheGroup;",';')
          s=s.replace("$('#applyVariantBtn').onclick=applyPackageVariant;",'')
          rep("'emailLink','emailContext','castingBriefRaw'","'emailLink','emailContext','emailPrivateNotes','castingBriefRaw'",'note listener')
          needle="$('#openWorkGmailBtn').onclick=openInWorkGmail;$('#emailModelSearch').oninput=renderEmailMatches;"
          rep(needle,needle+"if($('#photoLibraryModel'))$('#photoLibraryModel').onchange=renderPhotoLibrary;if($('#photoLibraryAddUrlBtn'))$('#photoLibraryAddUrlBtn').onclick=addPhotoLibraryUrl;if($('#photoLibraryUpload'))$('#photoLibraryUpload').onchange=e=>addPhotoLibraryFiles(e.target);",'library listeners')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate package builder
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "Add a roster group by main niche" index.html
          ! grep -q "<label>Package variant</label>" index.html
          grep -q "Private notes" index.html
          grep -q "Photo library" index.html
          grep -q "famous 90s model from Sweden" index.html
          grep -q "We preselected a few models and put them below" index.html
          grep -q "photoLibrary:{}" index.html
          python -c "import re; s=open('index.html',encoding='utf-8').read(); m=re.search(r'<script>(.*)</script>',s,re.S); assert m; open('/tmp/crm.js','w',encoding='utf-8').write(m.group(1))"
          node --check /tmp/crm.js

      - name: Commit CRM update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT CRM Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Match package draft template and add photo library"
          git push origin HEAD:main
