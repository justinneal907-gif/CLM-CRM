name: Seed Milan Day 1 CRM drafts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seed-milan-day1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch CRM
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'const MILAN_FIRST_DAY_DRAFTS=' not in s:
              profiles="""Object.assign(BRAND_PROFILES,{\"prada\":{\"look\":\"Intellectual / directional luxury runway\",\"niches\":[\"High Fashion / Editorial\",\"Luxury / Runway\"],\"why\":\"Prioritize narrow runway proportions, distinctive editorial faces, strong posture and fashion authority rather than broad commercial polish.\"},\"dhruv kapoor\":{\"look\":\"Eclectic directional co-ed / character-led fashion\",\"niches\":[\"High Fashion / Editorial\",\"Luxury / Runway\",\"Fashion-Commercial\"],\"why\":\"Prioritize individuality, movement, unconventional proportion and models who can carry a mix of polished and deliberately off-kilter styling.\"},\"diesel\":{\"look\":\"Attitude-led youth / directional co-ed fashion\",\"niches\":[\"High Fashion / Editorial\",\"Fashion-Commercial\",\"Luxury / Runway\"],\"why\":\"Prioritize personality, edge, strong movement and memorable faces; recent Diesel casting has been broad, diverse and less dependent on classical runway beauty.\"},\"j salinas\":{\"look\":\"International directional runway\",\"niches\":[\"High Fashion / Editorial\",\"Luxury / Runway\",\"Fashion-Commercial\"],\"why\":\"Prioritize runway proportions, individuality and a polished fashion presence that can work in an international Milan cast.\"},\"venerdì pomeriggio\":{\"look\":\"Personal, whimsical, character-led Milan fashion\",\"niches\":[\"High Fashion / Editorial\",\"Fashion-Commercial\",\"Beauty\"],\"why\":\"Prioritize memorable character, warmth and individuality over severe runway uniformity; the debut cast was small and personality-driven.\"},\"venerdi pomeriggio\":{\"look\":\"Personal, whimsical, character-led Milan fashion\",\"niches\":[\"High Fashion / Editorial\",\"Fashion-Commercial\",\"Beauty\"],\"why\":\"Prioritize memorable character, warmth and individuality over severe runway uniformity; the debut cast was small and personality-driven.\"}});\n"""
              contacts="""const MILAN_FIRST_DAY_CONTACTS=[{id:'milan-prada-ashley-brokaw',name:'Ashley Brokaw',company:'Prada / Ashley Brokaw Casting',email:'',relationship:'New',preferredNiches:'High Fashion / Editorial, Luxury / Runway',notes:'Milan Fashion Week S/S 2027 target · Sep 22, 2026 · Prior-season Prada casting lead. No verified public business email in stored research; S/S 27 assignment unconfirmed.'},{id:'milan-dhruv-kapoor-casting',name:'Dhruv Kapoor Casting Team',company:'Dhruv Kapoor',email:'',relationship:'New',preferredNiches:'High Fashion / Editorial, Luxury / Runway, Fashion-Commercial',notes:'Milan Fashion Week S/S 2027 target · Sep 22, 2026 · No verified current casting director/public casting email in stored research.'},{id:'milan-diesel-anita-bitton',name:'Anita Bitton',company:'Establishment Casting / Diesel',email:'anita@establishmentnewyork.com',relationship:'Developing',preferredNiches:'High Fashion / Editorial, Fashion-Commercial, Luxury / Runway',notes:'Milan Fashion Week S/S 2027 target · Sep 22, 2026 · Diesel F/W 26 was cast by Establishment Casting with Anita Bitton, Calvin Wilson and Greta Brunelli. Address already exists in prior agency email history; S/S 27 assignment unconfirmed.'},{id:'milan-jsalinas-caterina-matteucci',name:'Caterina Matteucci',company:'CM Casting / J.Salinas',email:'caterina@cmcasting.it',relationship:'New',preferredNiches:'High Fashion / Editorial, Luxury / Runway, Fashion-Commercial',notes:'Milan Fashion Week S/S 2027 target · Sep 22, 2026 · Prior F/W 26 research names Caterina Matteucci with Lorenzo de Fazio and Sofia Michaud; S/S 27 assignment unconfirmed.'},{id:'milan-venerdi-pomeriggio-casting',name:'Venerdì Pomeriggio Casting Team',company:'Venerdì Pomeriggio',email:'',relationship:'New',preferredNiches:'High Fashion / Editorial, Fashion-Commercial, Beauty',notes:'Milan Fashion Week S/S 2027 target · Sep 22, 2026 · No verified current casting director/public casting email in stored research.'}];\n"""
              drafts="""const MILAN_FIRST_DAY_DRAFTS=[{id:'milan-ss27-day1-prada',date:'2026-09-16',purpose:'submission',contactId:'milan-prada-ashley-brokaw',contactName:'Ashley Brokaw',company:'Prada',recipientEmail:'',brandProject:'Prada — Milan Fashion Week S/S 2027',packageLink:'',brief:'Milan Fashion Week · Tuesday, September 22, 2026 · 14:00 · Via Lorenzini, 14. Curated for Prada: narrow runway proportions, distinctive editorial faces and fashion authority. Prior-season casting lead noted; S/S 27 assignment/contact route not yet confirmed.',castingBriefRaw:'Milan Fashion Week S/S 2027 · Prada · Tuesday, September 22, 2026 · 14:00 · Via Lorenzini, 14.',parsedBrief:{project:'Prada',shootDate:'2026-09-22',dateText:'September 22, 2026',location:'Via Lorenzini, 14, Milan',nicheClues:['High Fashion / Editorial','Luxury / Runway']},subject:'S/S 2027 Model Package — Prada',includeStats:true,includePhotos:true,includeSources:true,models:['Claudia Lucchini','Agang','Rachel Stone'],modelIds:['new-york-women-claudia-lucchini','new-york-women-agang','new-york-women-rachel-stone'],html:'',source:'Milan S/S 2027 Day 1 research · curated 2026-09-16'},{id:'milan-ss27-day1-dhruv-kapoor',date:'2026-09-16',purpose:'submission',contactId:'milan-dhruv-kapoor-casting',contactName:'Dhruv Kapoor Casting Team',company:'Dhruv Kapoor',recipientEmail:'',brandProject:'Dhruv Kapoor — Milan Fashion Week S/S 2027',packageLink:'',brief:'Milan Fashion Week · Tuesday, September 22, 2026 · 15:00 · Via A. Calabiana, 6. Curated for eclectic, character-led casting: individuality, movement and unconventional proportion over generic polish. No verified current casting contact in stored research.',castingBriefRaw:'Milan Fashion Week S/S 2027 · Dhruv Kapoor · Tuesday, September 22, 2026 · 15:00 · Via A. Calabiana, 6.',parsedBrief:{project:'Dhruv Kapoor',shootDate:'2026-09-22',dateText:'September 22, 2026',location:'Via A. Calabiana, 6, Milan',nicheClues:['High Fashion / Editorial','Luxury / Runway']},subject:'S/S 2027 Model Package — Dhruv Kapoor',includeStats:true,includePhotos:true,includeSources:true,models:['Agang','Seven Wright','Ni Simone','Sal Soliman','Molly Gardiner'],modelIds:['new-york-women-agang','new-york-women-seven-wright','new-york-women-ni-simone','new-york-women-sal-soliman','new-york-women-molly-gardiner'],html:'',source:'Milan S/S 2027 Day 1 research · curated 2026-09-16'},{id:'milan-ss27-day1-diesel',date:'2026-09-16',purpose:'submission',contactId:'milan-diesel-anita-bitton',contactName:'Anita Bitton',company:'Diesel / Establishment Casting',recipientEmail:'anita@establishmentnewyork.com',brandProject:'Diesel — Milan Fashion Week S/S 2027',packageLink:'',brief:'Milan Fashion Week · Tuesday, September 22, 2026 · 16:00 · Via Moncucco, 35. Curated for Diesel: memorable faces, edge, movement and attitude. F/W 26 was cast by Establishment Casting; S/S 27 assignment remains unconfirmed.',castingBriefRaw:'Milan Fashion Week S/S 2027 · Diesel · Tuesday, September 22, 2026 · 16:00 · Via Moncucco, 35.',parsedBrief:{project:'Diesel',shootDate:'2026-09-22',dateText:'September 22, 2026',location:'Via Moncucco, 35, Milan',nicheClues:['High Fashion / Editorial','Fashion-Commercial','Luxury / Runway']},subject:'S/S 2027 Model Package — Diesel',includeStats:true,includePhotos:true,includeSources:true,models:['Agang','Claudia Lucchini','Seven Wright','Ni Simone','Molly Gardiner','Rachel Stone'],modelIds:['new-york-women-agang','new-york-women-claudia-lucchini','new-york-women-seven-wright','new-york-women-ni-simone','new-york-women-molly-gardiner','new-york-women-rachel-stone'],html:'',source:'Milan S/S 2027 Day 1 research · curated 2026-09-16'},{id:'milan-ss27-day1-jsalinas',date:'2026-09-16',purpose:'submission',contactId:'milan-jsalinas-caterina-matteucci',contactName:'Caterina Matteucci',company:'J.Salinas / CM Casting',recipientEmail:'caterina@cmcasting.it',brandProject:'J.Salinas — Milan Fashion Week S/S 2027',packageLink:'',brief:'Milan Fashion Week · Tuesday, September 22, 2026 · 17:00 · Via Soncino, 2. Curated for international runway proportions, individuality and polished fashion presence. Prior F/W 26 casting research is noted; S/S 27 assignment remains unconfirmed.',castingBriefRaw:'Milan Fashion Week S/S 2027 · J.Salinas · Tuesday, September 22, 2026 · 17:00 · Via Soncino, 2.',parsedBrief:{project:'J.Salinas',shootDate:'2026-09-22',dateText:'September 22, 2026',location:'Via Soncino, 2, Milan',nicheClues:['High Fashion / Editorial','Luxury / Runway']},subject:'S/S 2027 Model Package — J.Salinas',includeStats:true,includePhotos:true,includeSources:true,models:['Agang','Claudia Lucchini','Seven Wright','Rachel Stone','Ni Simone','Tinin'],modelIds:['new-york-women-agang','new-york-women-claudia-lucchini','new-york-women-seven-wright','new-york-women-rachel-stone','new-york-women-ni-simone','new-york-women-tinin'],html:'',source:'Milan S/S 2027 Day 1 research · curated 2026-09-16'},{id:'milan-ss27-day1-venerdi-pomeriggio',date:'2026-09-16',purpose:'submission',contactId:'milan-venerdi-pomeriggio-casting',contactName:'Venerdì Pomeriggio Casting Team',company:'Venerdì Pomeriggio',recipientEmail:'',brandProject:'Venerdì Pomeriggio — Milan Fashion Week S/S 2027',packageLink:'',brief:'Milan Fashion Week · Tuesday, September 22, 2026 · 18:00 · Via Toti, 2. Curated for the label’s small, personal and character-led casting: memorable individuality, warmth and fashion personality rather than rigid runway uniformity. No verified current casting contact in stored research.',castingBriefRaw:'Milan Fashion Week S/S 2027 · Venerdì Pomeriggio · Tuesday, September 22, 2026 · 18:00 · Via Toti, 2.',parsedBrief:{project:'Venerdì Pomeriggio',shootDate:'2026-09-22',dateText:'September 22, 2026',location:'Via Toti, 2, Milan',nicheClues:['High Fashion / Editorial','Fashion-Commercial','Beauty']},subject:'S/S 2027 Model Package — Venerdì Pomeriggio',includeStats:true,includePhotos:true,includeSources:true,models:['Molly Gardiner','Rachel Stone','Claudia Lucchini','Tinin','Seven Wright'],modelIds:['new-york-women-molly-gardiner','new-york-women-rachel-stone','new-york-women-claudia-lucchini','new-york-women-tinin','new-york-women-seven-wright'],html:'',source:'Milan S/S 2027 Day 1 research · curated 2026-09-16'}];\n"""
              s=s.replace("const NEW_KEY='jn-agency-crm-copy-v2';",profiles+"const NEW_KEY='jn-agency-crm-copy-v2';",1)
              s=s.replace('const WORK_GMAIL_SUBMISSIONS=[',contacts+'const WORK_GMAIL_SUBMISSIONS=[',1)
              s=s.replace('const seed={models:',drafts+'const seed={models:',1)
              s=s.replace('contacts:structuredClone(WORK_GMAIL_CONTACTS)','contacts:structuredClone([...WORK_GMAIL_CONTACTS,...MILAN_FIRST_DAY_CONTACTS])',1)
              s=s.replace('data.contacts=mergeContacts(WORK_GMAIL_CONTACTS,data.contacts||[])','data.contacts=mergeContacts([...WORK_GMAIL_CONTACTS,...MILAN_FIRST_DAY_CONTACTS],data.contacts||[])',1)
              s=s.replace('data.drafts=mergeRecovered(RECOVERED_DRAFTS,data.drafts||[])','data.drafts=mergeRecovered([...RECOVERED_DRAFTS,...MILAN_FIRST_DAY_DRAFTS],data.drafts||[])',1)
              s=s.replace("workGmailSubmissionCount:WORK_GMAIL_SUBMISSIONS.length};return data}","workGmailSubmissionCount:WORK_GMAIL_SUBMISSIONS.length,milanFirstDayDraftsAddedOn:'2026-09-16',milanFirstDayDraftCount:MILAN_FIRST_DAY_DRAFTS.length};return data}",1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and push
        run: |
          grep -q "milan-ss27-day1-prada" index.html
          grep -q "milan-ss27-day1-diesel" index.html
          grep -q "milan-ss27-day1-venerdi-pomeriggio" index.html
          git config user.name "ChatGPT CRM Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No CRM changes needed"
          else
            git commit -m "Seed Milan Fashion Week day 1 CRM drafts"
            git push origin HEAD:main
          fi
