name: Update CRM IndexedDB storage

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CRM storage layer
        run: python scripts/migrate_indexeddb.py
      - name: Validate CRM JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          assert 'CRM INDEXEDDB STORAGE V1' in html
          assert 'loadWorkspaceIndexedDB' in html
          assert "indexedDB.open(IDB_DB_NAME" in html
          assert 'let db=structuredClone(seed);let selected=[];' in html
          assert "$('#refreshBtn').onclick=async()=>" in html
          assert 'localStorage.setItem(NEW_KEY,JSON.stringify(db))' not in html
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          Path('/tmp/app.js').write_text('\\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit migration
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Migrate CRM persistence to IndexedDB"
          git pull --rebase origin main
          git push
