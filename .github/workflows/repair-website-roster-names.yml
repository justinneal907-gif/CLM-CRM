name: Repair website roster names

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve canonical CRM names
        run: python scripts/repair_website_roster_names.py
      - name: Validate CRM JavaScript
        run: node --check /tmp/app.js
      - name: Commit repaired roster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preserve canonical model names after website sync"
          git pull --rebase origin main
          git push
