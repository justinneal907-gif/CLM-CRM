name: Apply draft model controls

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-model-photo-library.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch CRM
        run: python tools/patch_draft_controls.py
      - name: Validate JavaScript
        run: |
          python -c "import re; s=open('index.html',encoding='utf-8').read(); open('/tmp/crm.js','w',encoding='utf-8').write(re.search(r'<script>(.*)</script>',s,re.S).group(1))"
          node --check /tmp/crm.js
          grep -q "function draftPhotoForModel" index.html
          grep -q "function moveSelectedModel" index.html
          grep -q "draft-photo-choice" index.html
      - name: Push CRM update
        run: |
          git config user.name "ChatGPT CRM Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add native draft photo and model ordering controls"
          git push origin HEAD:main
