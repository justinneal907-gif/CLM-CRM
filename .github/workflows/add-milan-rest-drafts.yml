name: Add remaining Milan Fashion Week drafts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-milan-rest-drafts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add researched Milan S/S 2027 drafts
        shell: python
        run: |
          from pathlib import Path
          import base64, json

          payload=json.loads(base64.b64decode(" ").decode("utf-8"))
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          if "const MILAN_REST_DRAFTS=" not in s:
              js=(
                  "const MILAN_REST_DRAFTS="+json.dumps(payload["drafts"],ensure_ascii=False,separators=(",",":"))+";\n"
                  "const MILAN_REST_BRAND_PROFILES="+json.dumps(payload["brand_profiles"],ensure_ascii=False,separators=(",",":"))+";\n"
                  "Object.assign(BRAND_PROFILES,MILAN_REST_BRAND_PROFILES);\n"
              )
              marker="const seed={models:"
              if marker not in s:
                  raise SystemExit("seed marker not found")
              s=s.replace(marker,js+marker,1)

          old="data.drafts=mergeRecovered([...RECOVERED_DRAFTS,...MILAN_FIRST_DAY_DRAFTS],data.drafts||[]).map(normalizeRecordModelNames);"
          new="data.drafts=mergeRecovered([...RECOVERED_DRAFTS,...MILAN_FIRST_DAY_DRAFTS,...MILAN_REST_DRAFTS],data.drafts||[]).map(normalizeRecordModelNames);"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit("draft merge marker not found")

          old_meta="milanFirstDayDraftCount:MILAN_FIRST_DAY_DRAFTS.length,modelIdentityUpdatedOn:'2026-09-16'"
          new_meta="milanFirstDayDraftCount:MILAN_FIRST_DAY_DRAFTS.length,milanRestDraftsAddedOn:'2026-09-16',milanRestDraftCount:MILAN_REST_DRAFTS.length,modelIdentityUpdatedOn:'2026-09-16'"
          if old_meta in s:
              s=s.replace(old_meta,new_meta,1)
          elif "milanRestDraftCount:MILAN_REST_DRAFTS.length" not in s:
              raise SystemExit("recovery metadata marker not found")

          p.write_text(s,encoding="utf-8")

      - name: Validate and commit
        shell: bash
        run: |
          grep -q "const MILAN_REST_DRAFTS=" index.html
          grep -q "milan-ss27-rest-jil-sander" index.html
          grep -q "milan-ss27-rest-bottega-veneta" index.html
          grep -q "milan-ss27-rest-rechenberg" index.html
          grep -q "MILAN_REST_BRAND_PROFILES" index.html
          grep -q "milanRestDraftCount:MILAN_REST_DRAFTS.length" index.html
          git diff --check
          git config user.name "ChatGPT CRM Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Add remaining Milan Fashion Week model packages"
          git push origin HEAD:main
