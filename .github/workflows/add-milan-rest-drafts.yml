name: Add remaining Milan Fashion Week drafts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-milan-rest-drafts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add researched Milan S/S 2027 drafts
        shell: python
        run: |
          from pathlib import Path
          import base64, datetime, json, re, unicodedata, zlib

          DATA = ""
          cfg = json.loads(zlib.decompress(base64.b64decode(DATA)).decode("utf-8"))

          model_map = cfg["models"]
          styles = cfg["styles"]
          cast_map = {}
          for line in cfg["cast"].splitlines():
              if not line.strip():
                  continue
              brand, contact, note, url, email = (line.split("|") + ["", "", "", "", ""])[:5]
              cast_map[brand] = {"contact": contact, "note": note, "url": url, "email": email}

          def slugify(value):
              x = unicodedata.normalize("NFKD", value).encode("ascii", "ignore").decode("ascii").lower()
              x = x.replace("&", " and ")
              x = re.sub(r"[^a-z0-9]+", "-", x).strip("-")
              return x

          def pretty_date(iso):
              d = datetime.date.fromisoformat(iso)
              return f"{d.strftime('%A')}, {d.strftime('%B')} {d.day}, {d.year}"

          drafts = []
          brand_profiles = {}
          for line in cfg["rows"].splitlines():
              date, time, brand, location, style_key, code_text = line.split("|")
              look, niches, rationale = styles[style_key]
              codes = code_text.split(",")
              picked = [model_map[c] for c in codes]
              hist = cast_map.get(brand, {})
              recipient = hist.get("email", "")
              contact = hist.get("contact", "")
              date_text = pretty_date(date)
              format_name = "Digital" if location == "Digital" else "Runway"
              if hist:
                  source = "CNMI S/S 2027 final calendar updated 2026-09-14 · " + hist.get("note", "") + " · S/S 2027 assignment not independently confirmed"
                  if recipient:
                      source += " · recipient address previously used in this CRM; re-check current routing before send"
              else:
                  source = "CNMI S/S 2027 final calendar updated 2026-09-14 · brand-fit analysis; current S/S 2027 casting contact not verified"

              brief = f"Milan Fashion Week · {date_text} · {time} · {location}. Curated for {brand}: {look.lower()}."
              raw = f"Milan Fashion Week S/S 2027 · {brand} · {date_text} · {time} · {location}."
              draft = {
                  "id": "milan-ss27-rest-" + slugify(brand),
                  "date": "2026-09-16",
                  "purpose": "submission",
                  "contactId": "",
                  "contactName": contact,
                  "company": brand,
                  "recipientEmail": recipient,
                  "brandProject": brand + " — Milan Fashion Week S/S 2027",
                  "packageLink": "",
                  "brief": brief,
                  "castingBriefRaw": raw,
                  "parsedBrief": {
                      "project": brand,
                      "shootDate": date,
                      "dateText": date_text.replace(date_text.split(",")[0] + ", ", ""),
                      "location": location,
                      "nicheClues": niches
                  },
                  "subject": "S/S 2027 Model Package — " + brand,
                  "includeStats": True,
                  "includePhotos": True,
                  "includeSources": True,
                  "models": [m["name"] for m in picked],
                  "modelIds": [m["id"] for m in picked],
                  "html": "",
                  "source": source,
                  "researchUrl": hist.get("url", ""),
                  "selectionRationale": rationale,
                  "format": format_name
              }
              drafts.append(draft)
              brand_profiles[brand.lower()] = {"look": look, "niches": niches, "why": rationale}

          if len(drafts) != 56:
              raise SystemExit(f"Expected 56 drafts, generated {len(drafts)}")
          if len({d["id"] for d in drafts}) != 56:
              raise SystemExit("Duplicate Milan draft IDs generated")

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          js = (
              "const MILAN_REST_DRAFTS=" + json.dumps(drafts, ensure_ascii=False, separators=(",", ":")) + ";\n"
              "const MILAN_REST_BRAND_PROFILES=" + json.dumps(brand_profiles, ensure_ascii=False, separators=(",", ":")) + ";\n"
              "Object.assign(BRAND_PROFILES,MILAN_REST_BRAND_PROFILES);\n"
          )

          if "const MILAN_REST_DRAFTS=" not in s:
              marker = "const seed={models:"
              if marker not in s:
                  raise SystemExit("seed marker not found")
              s = s.replace(marker, js + marker, 1)

          old = "data.drafts=mergeRecovered([...RECOVERED_DRAFTS,...MILAN_FIRST_DAY_DRAFTS],data.drafts||[]).map(normalizeRecordModelNames);"
          new = "data.drafts=mergeRecovered([...RECOVERED_DRAFTS,...MILAN_FIRST_DAY_DRAFTS,...MILAN_REST_DRAFTS],data.drafts||[]).map(normalizeRecordModelNames);"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("draft merge marker not found")

          old_meta = "milanFirstDayDraftCount:MILAN_FIRST_DAY_DRAFTS.length,modelIdentityUpdatedOn:'2026-09-16'"
          new_meta = "milanFirstDayDraftCount:MILAN_FIRST_DAY_DRAFTS.length,milanRestDraftsAddedOn:'2026-09-16',milanRestDraftCount:MILAN_REST_DRAFTS.length,modelIdentityUpdatedOn:'2026-09-16'"
          if old_meta in s:
              s = s.replace(old_meta, new_meta, 1)
          elif "milanRestDraftCount:MILAN_REST_DRAFTS.length" not in s:
              raise SystemExit("recovery metadata marker not found")

          p.write_text(s, encoding="utf-8")

      - name: Validate and commit
        shell: bash
        run: |
          grep -q "const MILAN_REST_DRAFTS=" index.html
          grep -q "milan-ss27-rest-jil-sander" index.html
          grep -q "milan-ss27-rest-bottega-veneta" index.html
          grep -q "milan-ss27-rest-rechenberg" index.html
          grep -q "MILAN_REST_BRAND_PROFILES" index.html
          grep -q "milanRestDraftCount:MILAN_REST_DRAFTS.length" index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('milan-ss27-rest-') >= 56
          assert 'anita@establishmentnewyork.com' in s
          assert 'onell@onellednacot.com' in s
          print('Milan rest draft validation passed')
          PY
          git diff --check
          git config user.name "ChatGPT CRM Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Add remaining Milan Fashion Week model packages"
          git push origin HEAD:main
