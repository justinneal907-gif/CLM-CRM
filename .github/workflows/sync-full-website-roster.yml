name: Sync full website roster

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4
      - name: Crawl Chez Les Mannequins and merge roster
        run: python scripts/sync_full_website_roster.py
      - name: Validate CRM JavaScript
        run: node --check /tmp/app.js
      - name: Commit website roster sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/website-roster-sync-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync full website model roster"
          git pull --rebase origin main
          git push
