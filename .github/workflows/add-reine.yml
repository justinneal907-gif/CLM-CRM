name: Add Reine to CRM

on:
  push:
    paths:
      - '.github/workflows/add-reine.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CRM roster
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          def replace_json_const(text, name, next_name, mutate):
              start_marker = f'const {name}='
              end_marker = f';\nconst {next_name}='
              start = text.index(start_marker) + len(start_marker)
              end = text.index(end_marker, start)
              data = json.loads(text[start:end])
              data = mutate(data)
              return text[:start] + json.dumps(data, ensure_ascii=False, separators=(',', ':')) + text[end:]

          reine = {
              'id': 'london-main-reine',
              'name': 'Reine',
              'location': 'London',
              'division': 'Main',
              'measurements': 'Height: 173cm | Bust: 100cm | Waist: 80cm | Hip: 107cm | Shoe: 38EU',
              'profileUrl': 'https://www.chezlesmannequins.com/lmain/reine',
              'photoUrl': '',
              'photoFilename': '',
              'source': 'Agency submission / Work Gmail',
              'sourceDate': '2026-09-15',
              'activeBoard': True,
              'notes': 'Added from ON Running Submission sent September 15, 2026.'
          }

          def roster_mutate(roster):
              roster = [m for m in roster if m.get('id') != reine['id'] and m.get('name') != 'Reine']
              roster.append(reine)
              return roster

          text = replace_json_const(text, 'BASE_ROSTER', 'NICHE_MAP', roster_mutate)
          text = replace_json_const(text, 'NICHE_MAP', 'SECONDARY_NICHE_MAP', lambda d: {**d, 'Reine': 'Fashion-Commercial'})
          text = replace_json_const(text, 'SECONDARY_NICHE_MAP', 'NICHE_ORDER', lambda d: {**d, 'Reine': 'Commercial / Lifestyle'})
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify Reine record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          s = text.index('const BASE_ROSTER=') + len('const BASE_ROSTER=')
          e = text.index(';\nconst NICHE_MAP=', s)
          roster = json.loads(text[s:e])
          hits = [m for m in roster if m.get('id') == 'london-main-reine']
          assert len(hits) == 1, hits
          m = hits[0]
          assert m['name'] == 'Reine'
          assert m['location'] == 'London'
          assert m['division'] == 'Main'
          assert m['measurements'] == 'Height: 173cm | Bust: 100cm | Waist: 80cm | Hip: 107cm | Shoe: 38EU'
          assert m['profileUrl'] == 'https://www.chezlesmannequins.com/lmain/reine'
          print('Reine roster record verified')
          PY

      - name: Run CRM tests
        run: |
          node tests/milan-availability.cjs
          node tests/milan-package-depth.cjs
          node tests/milan-open-close.cjs

      - name: Commit CRM update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Reine to CRM roster"
          git push
